defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe
  - override hydra/launcher: joblib

hydra:
  mode: "MULTIRUN"
  sweeper:
    sampler:
      seed: 123
    direction: minimize
    study_name: brax
    storage: null
    n_trials: 100
    n_jobs: 2
#    max_failure_rate: 0.0
    params:
      num_timesteps: choice(2000000, 5000000, 10000000, 20000000)
      num_minibatches: choice(8, 16, 32, 64, 128)
      num_envs: choice(256, 512, 1024, 2048, 4096, 8192, 16384)
      batch_size: choice(64, 128, 256, 512, 1024, 2048)


num_timesteps: 10000000
num_minibatches: 32
num_envs: 4096
batch_size: 128

# if true, simulate a failure by raising an exception
error: true